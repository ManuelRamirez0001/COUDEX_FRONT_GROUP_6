<!-- panel admin -->
<section class="admin-products container-fluid">
    <!-- titulo de la pagina -->
    <div class="admin-products-header mb-4">
        <h2 class="h4">Gestión de los productos</h2>
    </div>
    <!-- formulario para agregar un nuevo libro -->
    <section class="admin-product-form card p-4 mb-4">
        <h3 class="h5 mb-4">Agregar un nuevo libro</h3>
        <form id="form-libro">
            <div class="row g-4">
                <!-- campos del libro -->
                <div class="col-lg-8">
                    <!-- nombre del libro -->
                    <div class="mb-3">
                        <label for="nombre-libro" class="form-label">Nombre del libro</label>
                        <input type="text" class="form-control" id="nombre-libro" name="nombreLibro" required>
                    </div>
                    <!-- categoria -->
                    <div class="mb-3">
                        <label for="categoria-libro" class="form-label">Categoría</label>
                        <select class="form-select" id="categoria-libro" name="categoria" required>
                            <option value="" selected disabled>Seleccionar categoría</option>
                            <option value="novela">Novela</option>
                            <option value="cuento">Cuento</option>
                            <option value="poesia">Poesía</option>
                            <option value="historia">Historia</option>
                            <option value="ensayo">Ensayo</option>
                            <option value="infantil">Literatura infantil</option>
                            <option value="otros">Otros</option>
                        </select>
                    </div>
                    <!-- descripcion -->
                    <div class="mb-3">
                        <label for="descripcion-libro" class="form-label">Descripción (Sinopsis)</label>
                        <textarea class="form-control" id="descripcion-libro" name="descripcion" rows="4" required></textarea>
                    </div>
                    <!-- precio y stock -->
                    <div class="row g-4">
                        <!-- precio -->
                        <div class="col-md-6">
                            <label for="precio-libro" class="form-label">Precio</label>
                            <input type="number" class="form-control" id="precio-libro" name="precio" min="0" step="100" required>
                        </div>
                        <!-- stock -->
                        <div class="col-md-6">
                            <label for="stock-libro" class="form-label">Stock</label>
                            <input type="number" class="form-control" id="stock-libro" name="stock" min="0" step="1" required>
                        </div>
                    </div>
                </div>
                <!-- imagen del libro -->
                <div class="col-lg-4">
                    <div class="admin-product-image">
                        <label for="imagen-libro" class="form-label">Imagen (Portada libro)</label>
                        <!-- vista previa de la imagen -->
                        <div class="admin-image-preview d-flex justify-content-center align-items-center mb-3" id="preview-imagen">
                            <i class="bi bi-image fs-1"></i>
                        </div>
                        <!-- seleccionar archivo -->
                        <input type="file" class="form-control" id="imagen-libro" name="imagen" accept="image/*" required>
                    </div>
                </div>
            </div>
            <!-- botones del formulario -->
            <div class="admin-form-actions d-flex justify-content-end gap-2 mt-4">
                <button type="reset" class="btn btn-secondary">Limpiar</button>
                <button type="submit" class="btn btn-primary">Agregar libro</button>
            </div>
        </form>
    </section>
    <!-- tabla de libros registrados -->
    <section class="admin-products-list card p-4">
        <div class="admin-products-list-header d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
            <h3 class="h5 mb-0">Libros registrados</h3>
            <!-- buscador -->
            <div class="admin-products-search">
                <label for="buscar-libro" class="visually-hidden">Buscar libro</label>
                <input type="search" class="form-control" id="buscar-libro" placeholder="Buscar">
            </div>
        </div>
        <!-- tabla -->
        <div class="table-responsive">
            <table class="table table-bordered table-hover align-middle admin-table">
                <thead class="table-light">
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Portada</th>
                        <th scope="col">Nombre del libro</th>
                        <th scope="col">Precio</th>
                        <th scope="col">Stock</th>
                        <th scope="col">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-libros">
                    
                    
                </tbody>
            </table>
        </div>
        <!-- paginacion -->
        <nav class="admin-pagination mt-3" aria-label="Paginación de libros">
            <ul class="pagination pagination-sm justify-content-end mb-0">
                <li class="page-item">
                    <a class="page-link" href="#" aria-label="Página anterior"><i class="bi bi-chevron-left"></i></a>
                </li>
                <li class="page-item active">
                    <a class="page-link" href="#">1</a>
                </li>
                <li class="page-item">
                    <a class="page-link" href="#">2</a>
                </li>
                <li class="page-item">
                    <a class="page-link" href="#">3</a>
                </li>
                <li class="page-item">
                    <a class="page-link" href="#">4</a>
                </li>
                <li class="page-item">
                    <a class="page-link" href="#">5</a>
                </li>
                <li class="page-item">
                    <a class="page-link" href="#" aria-label="Página siguiente"><i class="bi bi-chevron-right"></i></a>
                </li>
            </ul>
        </nav>
    </section>
</section>
