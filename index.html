<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ratón de Biblioteca</title>
    <link rel="icon" href="img/icoimg.ico">
    <link
        href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Merriweather:wght@300;400;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <!-- Navbar: inyectado por loadContent.js -->
    <header id="navbar"></header>

    <!-- Contenido de página: inyectado por loadContent.js -->
    <main id="main"></main>

    <!-- Aside/ esta parte es del modal del carrito -->
    <aside class="offcanvas offcanvas-end" tabindex="-1" id="panelCarrito"
        aria-labelledby="tituloCarrito">
        <div class="offcanvas-header">
            <h2 class="offcanvas-title h5" id="tituloCarrito">Tu carrito</h2>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"
                aria-label="Cerrar carrito"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column">
            <ul id="lista-carrito" class="list-unstyled mb-4"></ul>
            <button type="button" id="btn-vaciar" class="btn btn-outline-danger mt-auto">
                Vaciar carrito
            </button>
        </div>
    </aside>

    <!-- Footer: inyectado por loadContent.js -->
    <footer id="footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./js/app.js"></script>
</body>

</html>
